name: Deploy to Fly.io

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy attempt 1
        id: deploy1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a terrellos-backend
        continue-on-error: true

      - name: Wait and retry if failed
        if: steps.deploy1.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Attempt 1 failed — waiting 90s for VM lease to clear..."
          sleep 90
          flyctl deploy --remote-only -a terrellos-backend
