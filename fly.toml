app = "terrellos-backend"
primary_region = "dfw"

[build]
dockerfile = "Dockerfile"

[env]
FRONTEND_URL = "https://pastor-ai-connect/pages.dev"
PORT = "8080"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8_080
min_machines_running = 1

  [[http_service.checks]]
  grace_period = "1m0s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "15s"

  [http_service.concurrency]
  hard_limit = 100
  soft_limit = 80
  type = "connections"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
