# fly.toml app configuration file generated for terrellos-backend on 2026-05-19T17:56:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'terrellos-backend'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  FRONTEND_URL = 'https://heavenlyeternalecho.com'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
