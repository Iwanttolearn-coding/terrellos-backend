# fly.toml app configuration file

app = "terrellos-backend"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  FRONTEND_URL = "https://heavenlyeternalecho.com"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.tls_options]
    alpn = ["h2", "http/1.1"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "15s"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 2